
<!DOCTYPE html>
<html>
<head>
    <title>WiFi Configuration</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="referrer no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        h1 {
            text-align: center;
        }
        form {
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 10px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        input[type="submit"]:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #ap_list {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
        #ap_list a {
            display: block;
            margin-top: 5px;
            color: #007bff;
            text-decoration: none;
        }
        #ap_list a:hover {
            text-decoration: underline;
        }

        .language-switch {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .language-switch select {
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <!-- 언어 선택 -->
    <div class="language-switch">
        <select id="language" onchange="changeLanguage()">
            <option value="ko-KR">한국어</option>
            <option value="en-US">English</option>
        </select>
    </div>
    
    <h1 data-lang="title">WiFi 설정</h1>
    <form action="/submit" method="post" onsubmit="submitForm(event)">
        <div id="saved_list_container" style="display: none;">
            <h3 data-lang="saved_wifi">저장된 WiFi</h3>
            <ul id="saved_list">
                <li>
                    <span>SSID</span>
                </li>
            </ul>
        </div>
        <div>
            <h3 data-lang="new_wifi">새 WiFi</h3>
            <p class="error" style="color: red; text-align: center;" id="error"></p>
            <p>
                <label for="ssid">SSID:</label>
                <input type="text" id="ssid" name="ssid" required>
            </p>
            <p>
                <label for="password" data-lang="password">비밀번호:</label>
                <input type="password" id="password" name="password">
            </p>
            <p style="text-align: center;">
                <input type="submit" value="연결" id="button" data-lang-value="connect">
            </p>
            <p id="ap_list"></p>
        </div>
    </form>

    <script type="text/javascript">
        const button = document.getElementById('button');
        const error = document.getElementById('error');
        const ssid = document.getElementById('ssid');

        // 다국어 문구 정의
        const translations = {
            'ko-KR': {
                title: 'WiFi 설정',
                saved_wifi: '저장된 WiFi',
                new_wifi: '새 WiFi',
                password: '비밀번호:',
                connect: '연결',
                select_wifi: '아래 목록에서 2.4G WiFi를 선택하세요:'
            },
            'en-US': {
                title: 'WiFi Configuration',
                saved_wifi: 'Saved WiFi',
                new_wifi: 'New WiFi',
                password: 'Password:',
                connect: 'Connect',
                select_wifi: 'Select an 2.4G WiFi from the list below:'
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('language').value;
            // 지정된 언어 키가 없으면 경고 후 한국어로 설정
            if (!translations[lang]) {
                console.warn(`지원되지 않는 언어: ${lang}, 기본(한국어)으로 설정합니다.`);
                document.getElementById('language').value = 'ko-KR';
                return changeLanguage();
            }
            
            document.querySelectorAll('[data-lang]').forEach(element => {
                const key = element.getAttribute('data-lang');
                element.textContent = translations[lang][key];
            });
            document.querySelectorAll('[data-lang-value]').forEach(element => {
                const key = element.getAttribute('data-lang-value');
                element.value = translations[lang][key];
            });

            // AP 리스트 안내 문구 변경
            const apList = document.getElementById('ap_list');
            if (apList.firstChild) {
                apList.firstChild.textContent = translations[lang].select_wifi;
            }

            // 사용자가 선택한 언어를 저장
            localStorage.setItem('preferred_language', lang);
        }

        function renderSavedList(data) {
            const savedListContainer = document.getElementById('saved_list_container');
            const savedList = document.getElementById('saved_list');
            savedList.innerHTML = '';
            data.forEach((ssid, index) => {
                const li = document.createElement('li');
                let html = `<span>${ssid}</span>`;
                // 첫 번째 항목 이외에는 우선순위/삭제 버튼 표시
                if (index > 0) {
                    html += ` <span>
                        <button type="button" onclick="setDefaultItem(this, ${index})">⬆️</button>
                        <button type="button" onclick="deleteItem(this, ${index})">❌</button>
                    </span>`;
                } else {
                    html += ` <span><button type="button" onclick="deleteItem(this, ${index})">❌</button></span>`;
                }
                li.innerHTML = html;
                savedList.appendChild(li);
            });
            if (data.length > 0) {
                savedListContainer.style.display = 'block';
            } else {
                savedListContainer.style.display = 'none';
            }
        }

        // 리스트에서 WiFi 제거
        function deleteItem(item, index) {
            item.disabled = true;
            fetch('/saved/delete?index=' + index)
                .then(response => response.json())
                .then(data => {
                    loadSavedList();
                });
        }

        // 해당 WiFi를 최우선 등록
        function setDefaultItem(item, index) {
            item.disabled = true;
            fetch('/saved/set_default?index=' + index)
                .then(response => response.json())
                .then(data => {
                    loadSavedList();
                });
        }

        // 저장된 WiFi 목록 불러오기
        function loadSavedList() {
            fetch('/saved/list')
                .then(response => response.json())
                .then(data => {
                    renderSavedList(data);
                });
        }

        // /scan으로부터 AP 리스트 불러오기
        function loadAPList() {
            if (button.disabled) {
                return;
            }

            fetch('/scan')
                .then(response => response.json())
                .then(data => {
                    const lang = document.getElementById('language').value;
                    const apList = document.getElementById('ap_list');
                    apList.innerHTML = '<p>' + translations[lang].select_wifi + '</p>';
                    data.forEach(ap => {
                        const link = document.createElement('a');
                        link.href = '#';
                        link.textContent = ap.ssid + ' (' + ap.rssi + ' dBm)';
                        if (ap.authmode === 0) {
                            link.textContent += ' 🌐';
                        } else {
                            link.textContent += ' 🔒';
                        }
                        link.addEventListener('click', () => {
                            ssid.value = ap.ssid;
                        });
                        apList.appendChild(link);
                    });
                    setTimeout(loadAPList, 5000);
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');

            // URL 파라미터 > 로컬 스토리지 > 기본 ko-KR
            const savedLang = langParam || localStorage.getItem('preferred_language') || 'ko-KR';
            document.getElementById('language').value = savedLang;
            changeLanguage();
            loadSavedList();
            loadAPList();
        });

        // 브라우저 뒤로가기 등으로 재진입했을 때 새로고침
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadSavedList();
            }
        });

        // 폼 전송
        async function submitForm(event) {
            event.preventDefault();
            button.disabled = true;
            error.textContent = '';

            const ssidValue = ssid.value;
            const passwordValue = document.getElementById('password').value;

            const payload = {
                ssid: ssidValue,
                password: passwordValue
            };

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || '연결 실패');
                }

                // 연결 성공 시 /done.html 로 이동
                button.disabled = false;
                window.location.href = '/done.html';
            } catch (err) {
                error.textContent = err.message;
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
