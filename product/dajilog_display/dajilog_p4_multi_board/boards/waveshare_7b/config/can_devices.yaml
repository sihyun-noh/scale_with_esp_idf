    display_name: Speed Sensor 1
    profile: tr07e
    enabled: true
    frames:
      config: {id: 0x7F5}
      measurement: {id: 0x3F5}
  - instance: motor_driver_1
    display_name: Motor Driver 1
    profile: moonwalker_mdc24
    enabled: true
    frames:
      request: {id: 0x001}
      response: {id: 0x001}
  - instance: motor_driver_2
    display_name: Motor Driver 2
    profile: moonwalker_mdc24
    enabled: true
    frames:
      request: {id: 0x002}
      response: {id: 0x002}
